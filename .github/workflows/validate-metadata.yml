name: Validate MCP metadata
on:
  push:
    branches: [main]
  pull_request:
jobs:
  metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest JSON and required fields
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('server.json').read_text())
          assert data['name'] == 'net.changuito/tienda'
          assert data['remotes'] == [{'type': 'streamable-http', 'url': 'https://mcp.changuito.net/mcp'}]
          assert data['repository']['url'] == 'https://github.com/PedidosUno/Changuito-MCP'
          assert len(data['description']) <= 100
          print('Static metadata OK (not live connectivity or official registry schema validation)')
          PY
